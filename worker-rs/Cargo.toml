[package]
name = "fastvideo-studio-worker"
version = "0.1.0"
edition = "2021"
description = "fastvideo-studio's RunPod serverless worker (the Rust port of worker/handler.py + fvstudio)"
license = "MIT"
publish = false

[lib]
name = "fvstudio"
path = "src/lib.rs"

[[bin]]
name = "studio-worker"
path = "src/main.rs"

[dependencies]
# Minimal and blocking: no async runtime, no OpenSSL (ureq's `tls` feature is rustls + webpki roots).
anyhow = "1"
hex = "0.4"
hmac = "0.12"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tiny_http = "0.12"
toml = "0.8"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
